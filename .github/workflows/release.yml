name: Release

on:
  push:
    tags:
    - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10' ]
    steps:
    - uses: actions/checkout@v4
    - name: Check the tag matches the package version
      # releases come from two branches (v0 -> 0.x, main -> 1.x); this stops a tag
      # publishing whatever version the other line happens to be on
      run: |
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "tag $GITHUB_REF_NAME does not match pyproject version $version"
          exit 1
        fi
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --no-dev
    - name: Build
      run: uv build

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10' ]
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --no-dev
    - name: Build
      run: uv build
    - name: Publish to PyPI
      run: |
        uv publish --username "__token__" --password "$PYPI_API_TOKEN"
      env:
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
