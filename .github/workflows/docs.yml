name: Release Docs

on:
  push:
    branches: [main, v0]
    paths:
      - "docs/**"
      - "semantic_router/**"
  workflow_dispatch:

jobs:
  build-docs:
    permissions:
      contents: read
      id-token: write
    name: Build Docs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - "3.11"
    steps:
    - uses: actions/checkout@v4
    - name: Resolve the docs version from the branch
      # each release line publishes into its own directory on the docs site
      run: |
        case "$GITHUB_REF_NAME" in
          main) echo "DOCS_VERSION=v1" >> "$GITHUB_ENV" ;;
          v0)   echo "DOCS_VERSION=v0" >> "$GITHUB_ENV" ;;
          *)    echo "no docs version is published from branch $GITHUB_REF_NAME"; exit 1 ;;
        esac
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: uv sync --group docs
    - name: Build docs
      run: |
        mkdir -p docs/build
        uv run pydoc-markdown .pydoc-markdown.yml

    - name: Checkout docs repo
      uses: actions/checkout@v4
      with:
        repository: aurelio-labs/docs
        path: temp-docs
        ref: main
        token: ${{ secrets.PAT }}

    - name: Process regular documentation
      run: |
        ROOT_DIR=$(pwd)

        # Clean existing documentation in target repo
        rm -rf "temp-docs/semantic-router/$DOCS_VERSION"
        mkdir -p "temp-docs/semantic-router/$DOCS_VERSION/"

        # Define directories to process (excluding client-reference which is auto-generated separately)
        DOC_DIRS=("get-started" "user-guide")

        # Process each documentation directory
        for doc_dir in "${DOC_DIRS[@]}"; do
          echo "Processing directory: $doc_dir"
          
          # Find all markdown files in the directory and its subdirectories
          find "docs/$doc_dir" -type f -name "*.md" | while read file; do
            # Get the relative path from the docs directory
            rel_path=$(realpath --relative-to="docs/$doc_dir" "$(dirname "$file")")
            file_name=$(basename "$file")
            
            # Create target directory if it doesn't exist
            if [ "$rel_path" = "." ]; then
              # File is directly in the doc_dir
              target_dir="$ROOT_DIR/temp-docs/semantic-router/$DOCS_VERSION/$doc_dir"
            else
              # File is in a subdirectory
              target_dir="$ROOT_DIR/temp-docs/semantic-router/$DOCS_VERSION/$doc_dir/$rel_path"
            fi
            
            mkdir -p "$target_dir"
            
            # Copy and rename from .md to .mdx
            cp "$file" "$target_dir/${file_name%.md}.mdx"
            echo "Copied $file to $target_dir/${file_name%.md}.mdx"
          done
        done

    - name: Process reference documentation
      run: |
        ROOT_DIR=$(pwd)
        rm -rf temp-docs/semantic-router/$DOCS_VERSION/client-reference
        mkdir -p temp-docs/semantic-router/$DOCS_VERSION/client-reference/

        # Check if build directory exists
        if [ -d "docs/build/semantic_router" ]; then
          # Find and copy all md files from reference docs
          cd docs/build/semantic_router
          find . -type f -name "*.md" | while read file; do
            dir=$(dirname "$file")
            echo "Processing file: $file in directory: $dir"
            mkdir -p "$ROOT_DIR/temp-docs/semantic-router/$DOCS_VERSION/client-reference/$dir"
            cp "$file" "$ROOT_DIR/temp-docs/semantic-router/$DOCS_VERSION/client-reference/${file%.md}.mdx"
          done
        else
          echo "Warning: Reference docs build directory does not exist. Skipping reference documentation processing."
        fi

    - name: Update frontmatter keys
      run: |
        find temp-docs/semantic-router/$DOCS_VERSION/client-reference -type f -name "*.mdx" -exec sed -i 's/sidebar_label:/sidebarTitle:/g' {} +

    - name: Install jq
      run: sudo apt-get install -y jq

    - name: Update mintlify docs.json navigation
      run: |
        # Get files and create grouped structure using jq
        files=$(cd "temp-docs/semantic-router/$DOCS_VERSION/client-reference" && find . -type f -name "*.mdx" | sed 's|^./||' | sed 's|.mdx$||' | sort | jq --arg ver "$DOCS_VERSION" -R -s '
          split("\n")[:-1] 
          | map("semantic-router/" + $ver + "/client-reference/" + .)
          | reduce .[] as $path (
              {"root": [], "groups": {}};
              if ($path | split("/") | length) == 5 then
                .groups[$path | split("/")[3]] += [$path]
              else
                .root += [$path]
              end
            )
          | [.root[], (.groups | to_entries | map({
              "group": .key,
              "pages": .value
            }))[]
          ]
        ')

        # Update the docs.json file
        jq --arg pages "$files" --arg ver "$DOCS_VERSION" '
          (.navigation.tabs[] | select(.tab == "Semantic Router")
           | .versions[] | select(.version == $ver)
           | .groups[] | select(.group == "Client Reference")
           | .pages) |= ($pages | fromjson)
        ' temp-docs/docs.json > temp-docs/docs.json.tmp && mv temp-docs/docs.json.tmp temp-docs/docs.json

    - name: Git commit and push
      working-directory: temp-docs
      run: |
        git config --local user.email "admin@aurelio.ai"
        git config --local user.name "aurelio-bot"
        git remote set-url origin https://aurelio-bot:${{ secrets.PAT }}@github.com/aurelio-labs/docs.git
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update semantic router $DOCS_VERSION docs" && git push)
