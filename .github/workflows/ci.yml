name: CI

# Runs on every pull request (forks included) and every push to main.
# Needs no secrets: the integration tests run against local service
# containers (pinecone-local, pgvector, qdrant). Tests that call paid APIs
# are marked `live` and run separately in live.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: make lint

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    services:
      pinecone:
        # In-memory Pinecone emulator. It opens one data-plane port per index
        # (5081, 5082, ...), so a range is published. tests/conftest.py deletes
        # every index a test creates, which keeps the range from filling up.
        image: ghcr.io/pinecone-io/pinecone-local:latest
        env:
          PORT: "5080"
          PINECONE_HOST: localhost
        ports:
          - 5080-5199:5080-5199
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    env:
      PINECONE_API_KEY: pclocal
      PINECONE_API_BASE_URL: http://localhost:5080
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      QDRANT_URL: http://localhost:6333
      # The integration tests embed with a small local model (all-MiniLM-L6-v2
      # via fastembed); cache the ~90MB download between runs.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-all-MiniLM-L6-v2

      # Every extra except the torch-based ones (`all` re-includes them, so it
      # is excluded too). The tests that need torch skip when it is absent.
      - name: Install
        run: uv sync --locked --all-extras --no-extra all --no-extra local --no-extra vision

      - name: Wait for pinecone-local
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5080/indexes -H "Api-Key: pclocal" >/dev/null && exit 0
            sleep 1
          done
          echo "pinecone-local did not become ready" >&2
          exit 1

      - name: Test
        run: make test
        env:
          # one line per test as it finishes, plus the slowest ones at the end
          PYTEST_ADDOPTS: -v --durations=15
